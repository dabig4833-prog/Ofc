name: Gerar APK e AAB

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Vira "true" quando você cadastra os segredos da chave de assinatura (veja o README)
      TEM_CHAVE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícones e splash
        run: npx capacitor-assets generate --android

      - name: Sincronizar o jogo com o Android
        run: npx cap sync android

      - name: Compilar APK de teste (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: naruto-life-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Compilar AAB para a Play Store
        if: env.TEM_CHAVE == 'true'
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Assinar o AAB
        if: env.TEM_CHAVE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          jarsigner -keystore release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "${{ secrets.KEY_ALIAS }}"

      - name: Enviar AAB assinado
        if: env.TEM_CHAVE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: naruto-life-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
